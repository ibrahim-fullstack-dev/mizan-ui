<!-- src/app/core/data-page/data-page.component.html -->
<div class="page-container">
  @if (config().layout.showToolbar) {
    <div class="toolbar">
      <app-input
        search-zone
        placeholder="Search bills invoices by client name..."
        [value]="searchQuery()"
        (valueChange)="searchQuery.set($event)"
      />
      <div class="toolbar-actions">
        @for (button of config().headerButtons ?? []; track button.key) {
          <app-button [config]="button.buttonConfig" (btnClick)="onHeaderAction(button.key)" />
        }
      </div>
    </div>
  }

  @if (config().layout.showTabs) {
    <div class="tabs-buttons">
      @for (tab of config().tabs ?? []; track tab.key) {
        <app-button [config]="tab.buttonConfig" (btnClick)="onTabClick(tab.key)" />
      }
    </div>
  }

  @if (config().layout.showTable) {
    <app-table
      [config]="config().table"
      (selectionChange)="onTableSelectionChange($event)"
      (pageChange)="onTablePageChange($event)"
      (actionClick)="onTableActionClick($event)"
    />
  }
</div>
