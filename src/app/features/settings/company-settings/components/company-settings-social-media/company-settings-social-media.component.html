<!-- src/app/features/settings/company-settings/components/company-settings-social-media/company-settings-social-media.component.html -->

<div class="company-form-slide">
  <div class="slide-header">
    <h3 class="slide-title">Social Media Links</h3>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <app-input [config]="socialMediaInputs.website" />
    </div>

    <div class="form-group">
      <app-input [config]="socialMediaInputs.linkedin" />
    </div>

    <div class="form-group">
      <app-input [config]="socialMediaInputs.twitter" />
    </div>

    <div class="form-group">
      <app-input [config]="socialMediaInputs.whatsapp" />
    </div>

    <div class="form-group">
      <app-input [config]="socialMediaInputs.facebook" />
    </div>

    <div class="form-group">
      <app-input [config]="socialMediaInputs.instagram" />
    </div>

    <div class="form-group">
      <app-input [config]="socialMediaInputs.youtube" />
    </div>

    <div class="form-group">
      <app-input [config]="socialMediaInputs.tiktok" />
    </div>
  </div>

  <div class="form-actions">
    <app-button [config]="buttons.cancel" (btnClick)="onCancel()" />

    <app-button [config]="buttons.save" (btnClick)="onSave()" />
  </div>
</div>
