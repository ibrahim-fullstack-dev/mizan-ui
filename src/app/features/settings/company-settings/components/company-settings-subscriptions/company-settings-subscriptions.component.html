<div class="company-form-slide">
  <div class="slide-header">
    <div class="header-title-wrapper">
      <h3 class="slide-title">Subscription Details</h3>
      <span class="status-badge active">Active</span>
    </div>
  </div>

  <div class="subscription-details-grid">
    <!-- Subscription Name -->
    <div class="info-item">
      <span class="info-label">Subscription Name</span>
      <span class="info-value highlight">البداية - Free</span>
    </div>

    <!-- Billing Cycle -->
    <div class="info-item">
      <span class="info-label">Billing Cycle</span>
      <span class="info-value">free</span>
    </div>

    <!-- Price -->
    <div class="info-item">
      <span class="info-label">Price</span>
      <span class="info-value">0.00 SAR</span>
    </div>

    <!-- Days Remaining -->
    <div class="info-item">
      <span class="info-label">Days Remaining</span>
      <span class="info-value">Unlimited</span>
    </div>

    <!-- Starts at -->
    <div class="info-item">
      <span class="info-label">Starts at</span>
      <span class="info-value">2026-06-13 00:00:00</span>
    </div>

    <!-- Ends at -->
    <div class="info-item">
      <span class="info-label">Ends at</span>
      <span class="info-value">-</span>
    </div>
  </div>

  <!-- Resource Limits Section -->
  <div class="resource-limits-section">
    <h4 class="section-subtitle">Resource Limits & Usage</h4>

    <div class="limits-grid">
      <!-- Database Limit -->
      <div class="limit-card">
        <div class="limit-header">
          <span class="limit-title">Database Limit</span>
          <span class="limit-metric">11 MB / 42 MB</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 26%"></div>
        </div>
      </div>

      <!-- Storage Limit -->
      <div class="limit-card">
        <div class="limit-header">
          <span class="limit-title">Storage Limit</span>
          <span class="limit-metric">0 B / 1 GB</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <!-- Requests Limit -->
      <div class="limit-card full-width">
        <div class="limit-header">
          <span class="limit-title">Requests Limit</span>
          <span class="limit-metric">70 / min</span>
        </div>
      </div>
    </div>
  </div>
</div>
