<!-- src/app/features/settings/company-settings/components/company-settings-basic/company-settings-basic.component.html -->

<div class="company-form-slide">
  <div class="slide-header">
    <h3 class="slide-title">Basic Information</h3>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <app-input [config]="inputs.name" />
    </div>

    <div class="form-group">
      <app-input [config]="inputs.email" />
    </div>

    <div class="form-group">
      <app-input [config]="inputs.contactNumber2" />
    </div>

    <div class="form-group">
      <app-input [config]="inputs.field" />
    </div>

    <div class="form-group">
      <app-input [config]="inputs.commercialRegistrationNo" />
    </div>

    <div class="form-group">
      <app-input [config]="inputs.organizationName" />
    </div>

    <div class="form-group">
      <app-input [config]="inputs.organizationalUnitName" />
    </div>

    <div class="form-group">
      <app-input [config]="inputs.otherIdType" />
    </div>

    <div class="form-group">
      <app-input [config]="inputs.otherIdNumber" />
    </div>

    <div class="form-group full-width">
      <app-input [config]="inputs.shortAddress" />
    </div>
  </div>

  <div class="form-actions">
    <app-button [config]="buttons.cancel" (btnClick)="onCancel()" />

    <app-button [config]="buttons.save" (btnClick)="onSave()" />
  </div>
</div>
