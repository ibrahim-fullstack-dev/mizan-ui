<!-- src/app/features/settings/company-settings/components/company-settings-address/company-settings-address.component.html -->

<div class="company-form-slide">
  <div class="slide-header">
    <h3 class="slide-title">Address Information</h3>
  </div>

  <div class="form-grid">
    <!-- Street Name -->
    <div class="form-group">
      <app-input [config]="addressInputs.streetName" />
    </div>

    <!-- Building No -->
    <div class="form-group">
      <app-input [config]="addressInputs.buildingNo" />
    </div>

    <!-- Subdivision -->
    <div class="form-group">
      <app-input [config]="addressInputs.subdivision" />
    </div>

    <!-- City -->
    <div class="form-group">
      <app-input [config]="addressInputs.city" />
    </div>

    <!-- Postal Code -->
    <div class="form-group">
      <app-input [config]="addressInputs.postalCode" />
    </div>

    <!-- Country -->
    <div class="form-group">
      <app-input [config]="addressInputs.country" />
    </div>
  </div>

  <div class="form-actions">
    <app-button [config]="buttons.cancel" (btnClick)="onCancel()" />

    <app-button [config]="buttons.save" (btnClick)="onSave()" />
  </div>
</div>
