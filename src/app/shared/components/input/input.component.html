<div class="input-container">
  @if (label()) {
    <label [for]="inputId" class="input-label">
      {{ label() }}
      @if (required()) {
        <span class="text-danger">*</span>
      }
    </label>
  }

  <input
    [id]="inputId"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    class="form-control"
    [class.is-invalid]="error()"
  />

  @if (error()) {
    <span class="error-message">{{ error() }}</span>
  }
</div>
