<header class="navbar-container">
  <!-- Left Section -->
  <div class="navbar-left">
    <app-button [config]="buttons.sidebarToggle" (btnClick)="onToggleSidebar()" />

    <h1 class="page-title">{{ pageTitle() }}</h1>
  </div>

  <!-- Center Section -->
  <div class="navbar-center">
    <button
      type="button"
      class="quick-search-trigger"
      (click)="searchClicked.emit()"
      aria-label="Quick search"
    >
      <lucide-icon name="search" class="search-icon" aria-hidden="true"></lucide-icon>

      <span class="search-placeholder"> Search accounts, transactions, clients... </span>

      <kbd class="search-shortcut">Ctrl K</kbd>
    </button>
  </div>

  <!-- Right Section -->
  <div class="navbar-right">
    <!-- Upgrade -->
    <app-button [config]="buttons.upgrade" (btnClick)="upgradeClicked.emit()" />

    <!-- Theme -->
    <app-button [config]="themeButtonConfig()" (btnClick)="onThemeToggle()" />

    <!-- Notifications -->
    <app-button
      [config]="buttons.notifications"
      class="notification-btn"
      (btnClick)="notificationClicked.emit()"
    >
      <span class="notification-badge" aria-hidden="true"></span>
    </app-button>

    <!-- Profile -->
    <div class="profile-dropdown-wrapper">...</div>
  </div>
</header>
